# 任务1：先运行团队已有的 simple_navigator/navigate.launch。
# 目标点继续由 simple_navigator/config/navigation_goal.yaml（或 map_goal_picker）管理，
# 比赛总控只旁路监听 move_base 的 goal/result，不修改导航包。
qr_navigation_timeout_sec: 120.0
# 到达二维码房间后：先按雷达相对墙距做有限幅度居中，再对准地图90度，
# 随后连续匀速旋转并持续解码。二维码按原始URL去重，满3个立即停车。
qr_odom_topic: /odom
qr_odom_stale_sec: 0.5
qr_odom_wait_sec: 2.0
qr_map_pose_topic: /amcl_pose
qr_center_enabled: true
qr_center_timeout_sec: 5.0
qr_center_tolerance_m: 0.035
qr_center_max_speed: 0.08
qr_center_gain: 0.75
qr_center_max_move_m: 0.16
qr_center_hard_clearance_m: 0.20
qr_center_sector_half_deg: 28.0
qr_center_pair_sum_min_m: 0.65
qr_center_pair_sum_max_m: 2.8
qr_center_axis_error_limit_m: 0.32
qr_scan_angular_speed: 0.60
qr_scan_direction: 1.0
qr_scan_first_round_step_angle_deg: 20.0
# Confirm odometry is stationary, then wait this long for a stable keyframe.
qr_scan_keyframe_wait_sec: 0.30
qr_scan_stationary_hold_sec: 0.15
qr_scan_stop_timeout_sec: 1.50
qr_scan_stationary_linear_tolerance: 0.025
qr_scan_stationary_angular_tolerance: 0.05
qr_scan_stationary_dropout_grace_sec: 0.15
qr_scan_stop_best_effort: true
# 第一圈每20度停车识别；不足时偏移5度，再以10度步长扫描第二圈。
qr_scan_second_round_step_angle_deg: 10.0
qr_scan_second_round_offset_deg: 5.0
qr_decoder_ready_timeout_sec: 6.0
qr_decoder_warmup_sec: 0.30
qr_scan_pending_idle_sec: 0.50
qr_scan_result_grace_sec: 3.20
qr_scan_step_timeout_margin_sec: 2.0
# 0表示不因圈数或时间提前结束，只在3个不同URL齐全后退出扫描。
qr_scan_timeout_sec: 0.0
qr_expected_count: 3
move_base_timeout_sec: 90.0

# 任务1语音握手沿用之前流程的话术。
voice_wakeup_reply: ""
voice_command_reply: "已接收任务，开始前往物品领取区。"
voice_retry_reply: "请再说一次"
voice_start_listening_service: /speech_command_node/start_listening
voice_stop_listening_service: /speech_command_node/stop_listening

# OCR时间窗证据。空白帧不清空，其他完整类别会清空当前目标证据。
ocr_required_hits: 2
ocr_evidence_window_sec: 1.5
ocr_ready_timeout_sec: 12.0
simulation_cache_required_hits: 2
simulation_cache_window_sec: 1.8
simulation_cache_observation_max_age_sec: 60.0
# Cache clear observations while the base is stopped or rotating at a scan
# point. Translational motion to the next point remains excluded.
simulation_cache_max_linear_speed: 0.05
simulation_cache_max_angular_speed: 0.80
coverage_observation_topic: /vision_triggered_navigator/coverage_observation
# 图像横向误差为正时的转向符号。首次低速居中测试必须确认方向。
target_center_steering_sign: -1.0
target_center_coarse_step_deg: 4.0
target_center_fine_step_deg: 2.0
target_center_start_speed: 0.28
target_center_max_speed: 0.45
target_center_timeout_sec: 20.0
# 厂牌居中后，车头射线相对相机光轴的实车标定偏差。
camera_boresight_yaw_offset: 0.292
camera_horizontal_fov_deg: 70.0
camera_bearing_sign: -1.0

# 厂牌物理坐标定位首阶段只旁路观察，不改变现有导航和停车触发。
# 完成三面墙及墙角实测后，将 shadow 改为 active 才接管触发门控。
factory_sign_localization_mode: shadow
factory_sign_localization_topic: /factory_sign/localization_estimate
factory_sign_camera_info_topic: /usb_cam/camera_info
factory_sign_sync_tolerance_sec: 0.20
factory_sign_stationary_hold_sec: 0.30
factory_sign_localization_required_hits: 2
factory_sign_localization_evidence_window_sec: 1.5
factory_sign_localization_max_samples: 24
factory_sign_min_bbox_width_ratio: 0.09
factory_sign_min_bbox_height_ratio: 0.06
factory_sign_min_bbox_area_ratio: 0.006
factory_sign_bbox_edge_margin_ratio: 0.02
factory_sign_camera_x: 0.15
factory_sign_camera_y: 0.0
factory_sign_laser_x: 0.08
factory_sign_laser_y: 0.0
factory_sign_laser_yaw: 0.0
factory_sign_wall_half_angle_deg: 20.0
factory_sign_wall_min_points: 12
factory_sign_wall_min_span: 0.25
factory_sign_wall_max_residual: 0.02
factory_sign_non_target_min_scan_steps: 2
factory_sign_room_corners:
  - [-2.2311, -1.2505]
  - [ 2.8000, -1.1940]
  - [-2.2197, -3.2746]
  - [ 2.7739, -3.2186]
factory_navigation_timeout_sec: 420.0
# Once target parking starts, avoidance/recentering may not extend this hard
# deadline. The controller safely stops and announces completion on expiry.
parking_fail_open_hard_timeout_sec: 25.0
parking_fail_open_stall_timeout_sec: 45.0
parking_fail_open_total_timeout_sec: 90.0
# Execute two physical parking operations. The actual simulator is postponed;
# after the second parking, hold still for this interval and continue.
simulation_placeholder_hold_sec: 0.0
quiet_child_logs: true
child_log_dir: ~/.ros/src3_competition_children
ocr_terminal_log_interval_sec: 6.0
# 任务2停车框贴墙且厂牌居中，以四轮全部入框为目标。
parking_box_width: 0.50
parking_box_depth: 0.50
parking_goal_offset: 0.26
parking_staging_offset: 0.55
parking_staging_timeout_sec: 20.0
parking_staging_position_tolerance: 0.10
parking_staging_yaw_tolerance: 0.10
parking_docking_timeout_sec: 30.0
parking_dock_max_x: 0.10
parking_dock_max_y: 0.06
parking_dock_max_yaw: 0.30
parking_dock_min_yaw: 0.30
parking_dock_normal_tolerance: 0.02
parking_dock_tangent_tolerance: 0.02
parking_dock_yaw_tolerance: 0.06
parking_dock_translation_yaw_gate: 0.22
parking_dock_forward_yaw_gate: 0.14
parking_dock_forward_tangent_gate: 0.12
parking_min_wall_distance: 0.19
parking_lidar_stop_distance: 0.15
parking_recenter_tolerance: 0.04
parking_recenter_timeout_sec: 8.0
parking_recenter_initial_wait_sec: 1.0
parking_recenter_lateral_kp: 0.16
parking_recenter_lateral_sign: 1.0
parking_recenter_min_lateral: 0.015
parking_recenter_max_lateral: 0.065
parking_recenter_max_travel: 0.30
parking_recenter_yaw_kp: 1.0
parking_recenter_yaw_tolerance_deg: 2.0
parking_recenter_max_yaw: 0.18
parking_recenter_stable_sec: 0.25
parking_recenter_required_hits: 3
parking_recenter_side_half_angle_deg: 25.0
parking_recenter_side_stop_m: 0.18
parking_recenter_side_slow_m: 0.28
parking_wall_fit_half_angle_deg: 35.0
parking_wall_fit_min_points: 12
parking_wall_fit_min_span: 0.25
parking_wall_fit_near_min_span: 0.18
parking_wall_fit_max_distance_jump: 0.05
parking_wall_fit_max_normal_jump_deg: 8.0
parking_wall_fit_max_residual: 0.015
parking_wall_fit_max_normal_error_deg: 20.0
parking_wall_fit_grace_sec: 1.5
parking_wall_fit_filter_alpha: 0.45
parking_xy_tolerance: 0.04
parking_yaw_tolerance: 0.06
parking_normal_offset: 0.0
parking_tangent_offset: 0.03
target_trigger_service: /vision_triggered_navigator/trigger_target
trigger_ack_timeout_sec: 2.0
task1_task2_handoff_timeout_sec: 5.0
task1_task2_handoff_stable_sec: 0.25
task1_wait_for_announcement_completion: true
task1_navigation_release_delay_sec: 0.8
# 任务2厂牌覆盖扫描：仅传给coverage_search_mode导航节点。
coverage_scan_step_deg: 20.0
coverage_scan_angular_speed: 0.35
coverage_scan_dwell_sec: 0.65
coverage_candidate_hold_sec: 1.2
coverage_scan_max_dwell_sec: 2.0
coverage_scan_pose_timeout_sec: 0.5
coverage_goal_soft_timeout_sec: 7.0
coverage_goal_hard_timeout_sec: 10.0
coverage_goal_progress_window_sec: 5.0
coverage_goal_min_progress: 0.03
coverage_rotation_watchdog_window_sec: 5.0
coverage_rotation_min_progress: 0.03
coverage_rotation_max_yaw_deg: 90.0
coverage_goal_retry_count: 1
coverage_anchor_position_tolerance: 0.20
coverage_anchor_yaw_tolerance_deg: 5.0
coverage_anchor_yaw_hold_sec: 0.20
coverage_anchor_yaw_timeout_sec: 12.0
coverage_no_progress_timeout_sec: 5.5
coverage_fallback_enabled: true
coverage_fallback_make_plan_tolerance_m: 0.12

# 仿真独立 ROS Master，通过 UDP 协同（xunfei2026_virtual_collaboration_v1）。
# sim_bridge_host 需在启动环境或 launch 中设置为运行 Gazebo 的电脑 IP。
sim_udp_send_port: 39026
sim_udp_recv_port: 39027
sim_timeout_sec: 900.0

# 交通灯坐标必须经实车标定后显式设置。未设置时流程安全暂停。
traffic_pose_configured: false
traffic_x: 0.3695
traffic_y: -3.09
traffic_yaw: 0.0
traffic_timeout_sec: 180.0

track_timeout_sec: 420.0
task45_extra_distance_m: 0.20
task45_extra_distance_tolerance_m: 0.015
task45_extra_distance_speed_mps: 0.18
task45_extra_distance_timeout_sec: 10.0
status_topic: /competition/status
task1_result_topic: /competition/task1_result
