odom_frame_id: odom
base_frame_id: base_link
global_frame_id: map
transform_tolerance: 0.5
gui_publish_rate: 10.0

odom_model_type: omni
odom_alpha1: 0.2
odom_alpha2: 0.2
odom_alpha3: 0.2
odom_alpha4: 0.2
odom_alpha5: 0.15

laser_model_type: likelihood_field_prob
laser_max_beams: 90
laser_z_hit: 0.95
laser_z_short: 0.02
laser_z_max: 0.02
laser_z_rand: 0.01
laser_sigma_hit: 0.08
# A compact likelihood field keeps cone returns from rewarding a pose near a
# different wall in the large, weakly constrained room.
laser_likelihood_max_dist: 0.50
# Skip scan beams caused by temporary cones, while retaining static-wall beams
# that agree across the already-converged particle cloud.
do_beamskip: true
beam_skip_distance: 0.35
beam_skip_threshold: 0.30
beam_skip_error_threshold: 0.90

min_particles: 500
max_particles: 2000
kld_err: 0.05
kld_z: 0.99
# The room route contains long omni translations and many in-place turns.
# Correct against static walls often enough that mecanum odometry cannot build
# a metre-scale offset between laser updates.
update_min_d: 0.08
update_min_a: 0.08
resample_interval: 2
# Starting localization is known and validated before navigation. Random pose
# injection on a cone-heavy scan can jump map->odom to a symmetric room wall.
recovery_alpha_slow: 0.0
recovery_alpha_fast: 0.0
use_map_topic: false
first_map_only: true
