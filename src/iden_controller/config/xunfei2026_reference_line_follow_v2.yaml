# New-only line-follow configuration based on ~/src/ucar_2026_line_follow.
image_topic: /ucar_camera/image_raw
odom_topic: /odom
cmd_vel_topic: /cmd_vel
handoff_topic: /factory/virtual_collaboration_status
status_topic: /reference_line_follow/status
debug_image_topic: /reference_line_follow/debug_image
publish_debug: true

# Required hard turn happens after the existing 25 cm advance.
hard_turn_enabled: true
hard_turn_angle_deg: 60.0
hard_turn_speed: 0.42
hard_turn_min_speed: 0.16
hard_turn_tolerance_deg: 2.5
hard_turn_timeout_s: 6.0
hard_turn_settle_s: 0.12

# White-line extraction and multi-row lane model.
roi_y_start_ratio: 0.45
roi_y_end_ratio: 1.0
white_s_max: 85
white_v_min: 150
gray_white_threshold: 185
morph_kernel_size: 5
min_contour_area: 60.0
min_line_width_px: 6
max_line_width_ratio: 0.32
min_segment_gap_px: 12
scan_row_ratios: [0.20, 0.35, 0.50, 0.65, 0.80, 0.92]
target_row_weight_bottom: 1.5
lane_width_px: 230.0
lane_width_px_min: 150.0
lane_width_px_max: 330.0
lane_width_adapt_alpha: 0.12
fork_candidate_count: 3

# Smooth closed-loop motion.  No lateral/y-axis command is ever issued.
base_speed: 0.24
min_speed: 0.09
kp: 0.0042
kd: 0.0010
max_angular_speed: 0.62
error_slowdown_px: 150.0
error_filter_alpha: 0.62
command_filter_alpha: 0.55
max_linear_accel: 0.55
max_linear_decel: 0.90
max_angular_accel: 2.2
lost_line_coast_s: 0.16
image_timeout_s: 0.45

# Finish-box handling adapted from the reference package.
finish_enable_delay_s: 8.0
finish_confirm_frames: 4
finish_min_width_ratio: 0.64
finish_min_side_height_ratio: 0.24
finish_approach_distance_m: 0.34
finish_approach_speed: 0.10
